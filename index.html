<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Blur + Tones</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#202020">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root { color-scheme: light dark; --fg:#1c1917; --mut:#6b6560; --card:#ffffff; --bd:#dedad6; --ac:#2563eb; --acfg:#fff; --soft:#eef2ff; --view:#202020; }
  @media (prefers-color-scheme: dark){ :root{ --fg:#f5f5f4; --mut:#a8a29e; --card:#1c1917; --bd:#36312d; --ac:#60a5fa; --acfg:#0b1220; --soft:#1e293b; } }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--view)}

  /* ---------- full-screen viewer ---------- */
  .stage{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--view)}
  .stage canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;box-shadow:0 4px 30px #0008}
  .empty{position:absolute;inset:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
         color:#cfcac5;text-align:center;border:2px dashed #555;border-radius:18px;cursor:pointer}
  .empty b{color:#93b4ff;font-size:18px}
  .empty input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:100px;cursor:pointer}

  /* ---------- floating controls ---------- */
  .fl{position:fixed;z-index:6;display:flex;align-items:center;gap:8px}
  .top{top:12px;left:12px;right:12px;justify-content:space-between;pointer-events:none}
  .top > *{pointer-events:auto}
  .pill{background:#000a;color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:7px 12px;font-size:13px;
        font-variant-numeric:tabular-nums;border:1px solid #fff2}
  .fb{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;min-width:44px;padding:0 14px;border-radius:999px;
      background:#000b;color:#fff;border:1px solid #fff3;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:inherit;font-size:14px;cursor:pointer;
      user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .fb svg{width:22px;height:22px}
  .fb.round{width:58px;height:58px;padding:0}
  .fb.pri{background:var(--ac);color:var(--acfg);border-color:transparent;box-shadow:0 6px 20px #0006}
  .fb.pri svg{width:28px;height:28px}
  .fb input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:100px;cursor:pointer}
  .bl{bottom:20px;left:16px} .br{bottom:20px;right:16px}
  .fb.on{background:#fff;color:#000}
  .gest{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:6;pointer-events:none;color:#fffc;font-size:12px;background:#0008;padding:5px 10px;border-radius:999px;transition:opacity .4s;white-space:nowrap}

  /* ---------- settings sheet ---------- */
  .scrim{position:fixed;inset:0;z-index:8;pointer-events:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:64dvh;overflow:auto;z-index:10;
         background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);
         backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
         border-radius:20px 20px 0 0;border:1px solid var(--bd);border-bottom:0;padding:0 14px 18px;box-shadow:0 -10px 40px #0006;
         transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
  .sheet.open{transform:none}
  .grab{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:8px 0 6px;background:inherit;z-index:1;cursor:pointer}
  .grab i{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:40px;height:5px;border-radius:3px;background:var(--bd)}
  .grab h2{font-size:15px;margin:14px 0 0}
  .x{margin-top:10px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--bd);background:transparent;color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
  .sec{padding:10px 0;border-top:1px solid var(--bd)}
  .sec:first-of-type{border-top:0}
  .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .lab span{font-weight:600}
  .lab small{color:var(--mut);font-weight:400;margin-left:6px}
  .lab output{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
  .srow{display:flex;align-items:center;gap:10px}
  .srow input[type=range]{flex:1;height:44px;accent-color:var(--ac);margin:0}
  .step{width:46px;height:46px;flex:none;border-radius:12px;border:1px solid var(--bd);background:var(--soft);color:var(--fg);
        font-size:24px;line-height:1;font-weight:600;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .step:active{transform:scale(.94)}
  .step:disabled{opacity:.35}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{min-width:44px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--bd);background:transparent;color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
  .chip.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
  .sw{display:flex;height:18px;border-radius:5px;overflow:hidden;margin-top:8px;border:1px solid var(--bd)}
  .sw div{flex:1}
  .seg{display:flex;background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:3px}
  .seg button{flex:1;height:40px;border:0;border-radius:9px;background:transparent;color:var(--fg);font:inherit;cursor:pointer}
  .seg button.on{background:var(--card);box-shadow:0 1px 3px #0003;font-weight:600}
  .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
  .btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 10px;border-radius:12px;
       border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
  .btn.pri{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600}
  .btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:100px;cursor:pointer}
  .fallback{display:block;margin-top:12px;font-size:12px;color:var(--mut)}
  .fallback input{display:block;margin-top:4px;font:inherit;color:var(--fg);max-width:100%}

  /* ---------- save overlay ---------- */
  .ov{position:fixed;inset:0;background:#000e;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
  .ov img{max-width:100%;max-height:75dvh;border-radius:8px;-webkit-touch-callout:default}
  .ov p{color:#fff;margin:0;text-align:center}
</style>
</head>
<body>

<div class="stage" id="stage">
  <label class="empty" id="empty">
    <b>Tap to choose a photo</b>
    <span>Blur it, then reduce it to 2, 3, 4… tones</span>
    <input type="file" accept="image/*" class="fileIn" aria-label="Choose photo">
  </label>
  <canvas id="cv" hidden></canvas>
</div>

<div class="fl top">
  <div class="pill" id="readout">Blur + Tones</div>
  <button class="fb" id="fitBtn" hidden aria-label="Fit image to screen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fit
  </button>
</div>
<div class="gest" id="gest" hidden>Drag to pan · pinch or double-tap to zoom</div>

<div class="fl bl" id="cmpWrap" hidden>
  <button class="fb" id="cmp" aria-label="Hold to see original">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>Hold: original
  </button>
</div>
<div class="fl br">
  <button class="fb round pri" id="fab" aria-label="Open settings" aria-expanded="false" aria-controls="sheet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="Settings">
  <div class="grab" id="grab"><i></i><h2>Adjust</h2><button class="x" id="closeSheet">Hide ▾</button></div>

  <div class="sec">
    <div class="lab"><span>Blur</span><output id="bv">8</output></div>
    <div class="srow">
      <button class="step" data-t="blur" data-d="-1" aria-label="Less blur">−</button>
      <input type="range" id="blur" min="0" max="60" step="1" value="8" aria-label="Blur amount">
      <button class="step" data-t="blur" data-d="1" aria-label="More blur">+</button>
    </div>
    <div class="chips" data-for="blur">
      <button class="chip" data-v="0">Off</button><button class="chip" data-v="4">Light</button>
      <button class="chip" data-v="12">Medium</button><button class="chip" data-v="30">Heavy</button>
    </div>
  </div>

  <div class="sec">
    <div class="lab"><span id="tLab">Tones</span><output id="tv">3</output></div>
    <div class="srow">
      <button class="step" data-t="tones" data-d="-1" aria-label="Fewer tones">−</button>
      <input type="range" id="tones" min="2" max="16" step="1" value="3" aria-label="Number of tones">
      <button class="step" data-t="tones" data-d="1" aria-label="More tones">+</button>
    </div>
    <div class="chips" data-for="tones">
      <button class="chip" data-v="2">2</button><button class="chip" data-v="3">3</button><button class="chip" data-v="4">4</button>
      <button class="chip" data-v="5">5</button><button class="chip" data-v="7">7</button><button class="chip" data-v="9">9</button>
    </div>
    <div class="sw" id="sw" hidden></div>
  </div>

  <div class="sec">
    <div class="seg" role="group" aria-label="Colour mode">
      <button id="mGray" class="on" aria-pressed="true">Greyscale</button>
      <button id="mCol" aria-pressed="false">Colour</button>
    </div>
    <div class="actions">
      <label class="btn">New photo<input type="file" accept="image/*" class="fileIn" aria-label="Change photo"></label>
      <button class="btn" id="reset">Reset</button>
      <button class="btn pri" id="save" disabled>Save</button>
    </div>
    <label class="fallback">Photo picker not opening? Try this one:
      <input type="file" class="fileIn" accept="image/*,.jpg,.jpeg,.png,.webp,.heic">
    </label>
  </div>
</div>

<div class="ov" id="ov" hidden>
  <img id="ovImg" alt="Result image">
  <p>Long-press the image to save it</p>
  <button class="btn" id="ovClose">Done</button>
</div>

<script>
const $ = id => document.getElementById(id);
const MAXW = 1400, DEF = { blur: 8, tones: 3, gray: true };
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
let base = null, W = 0, H = 0, gray = true, showOrig = false;
let cacheKey = '', planes = null;

/* ---------- settings memory (best effort) ---------- */
try {
  const s = JSON.parse(localStorage.getItem('blurTones') || 'null');
  if (s) { $('blur').value = s.blur; $('tones').value = s.tones; gray = s.gray !== false; }
} catch (e) {}
function saveSettings() { try { localStorage.setItem('blurTones', JSON.stringify({ blur: +$('blur').value, tones: +$('tones').value, gray })); } catch (e) {} }

/* ---------- loading ---------- */
document.querySelectorAll('.fileIn').forEach(i => i.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (f) load(f); e.target.value = '';
}));
document.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (it) load(it.getAsFile());
});
function load(f) {
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const s = Math.min(1, MAXW / Math.max(im.naturalWidth, im.naturalHeight));
    W = Math.max(1, Math.round(im.naturalWidth * s)); H = Math.max(1, Math.round(im.naturalHeight * s));
    cv.width = W; cv.height = H; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.drawImage(im, 0, 0, W, H);
    base = ctx.getImageData(0, 0, W, H);
    URL.revokeObjectURL(url);
    cacheKey = '';
    $('empty').hidden = true; cv.hidden = false; $('cmpWrap').hidden = false; $('save').disabled = false;
    closeSheet();
    render(); fit();
    showHint();
  };
  im.onerror = () => { $('empty').querySelector('span').textContent = "Couldn't read that image. Try a JPG or PNG."; };
  im.src = url;
}

/* ---------- blur (3-pass box ≈ gaussian) ---------- */
function boxH(s, d, w, h, r) { const n = 2*r+1; for (let y = 0; y < h; y++) { const o = y*w; let a = 0;
  for (let i = -r; i <= r; i++) a += s[o + Math.min(w-1, Math.max(0, i))];
  for (let x = 0; x < w; x++) { d[o+x] = a/n; a += s[o + Math.min(w-1, x+r+1)] - s[o + Math.max(0, x-r)]; } } }
function boxV(s, d, w, h, r) { const n = 2*r+1; for (let x = 0; x < w; x++) { let a = 0;
  for (let i = -r; i <= r; i++) a += s[Math.min(h-1, Math.max(0, i))*w + x];
  for (let y = 0; y < h; y++) { d[y*w+x] = a/n; a += s[Math.min(h-1, y+r+1)*w + x] - s[Math.max(0, y-r)*w + x]; } } }
function blurPlane(p, w, h, r) {
  if (r < 1) return p;
  let a = p, b = new Float32Array(p.length);
  for (let k = 0; k < 3; k++) { boxH(a, b, w, h, r); [a, b] = [b, a]; boxV(a, b, w, h, r); [a, b] = [b, a]; }
  return a;
}
function getPlanes(r) {
  const key = r + '|' + gray;
  if (key === cacheKey) return planes;           // changing tones only = no re-blur
  const px = base.data, N = W * H;
  if (gray) {
    const L = new Float32Array(N);
    for (let i = 0; i < N; i++) L[i] = 0.2126*px[i*4] + 0.7152*px[i*4+1] + 0.0722*px[i*4+2];
    planes = [blurPlane(L, W, H, r)];
  } else {
    planes = [0,1,2].map(c => { const p = new Float32Array(N); for (let i = 0; i < N; i++) p[i] = px[i*4+c]; return blurPlane(p, W, H, r); });
  }
  cacheKey = key; return planes;
}

/* ---------- render ---------- */
function render() {
  updateUI();
  if (!base) return;
  if (showOrig) { ctx.putImageData(base, 0, 0); return; }
  const n = +$('tones').value;
  const r = Math.round(+$('blur').value / 100 * Math.max(W, H) * 0.12);
  const P = getPlanes(r), N = W * H;
  const lut = new Uint8ClampedArray(256);
  for (let v = 0; v < 256; v++) lut[v] = Math.round(Math.round(v / 255 * (n-1)) / (n-1) * 255);
  const out = ctx.createImageData(W, H), od = out.data;
  if (gray) { const L = P[0]; for (let i = 0; i < N; i++) { const v = lut[L[i] + .5 | 0]; od[i*4] = od[i*4+1] = od[i*4+2] = v; od[i*4+3] = 255; } }
  else { const [R, G, B] = P; for (let i = 0; i < N; i++) { od[i*4] = lut[R[i]+.5|0]; od[i*4+1] = lut[G[i]+.5|0]; od[i*4+2] = lut[B[i]+.5|0]; od[i*4+3] = 255; } }
  ctx.putImageData(out, 0, 0);
}
let raf = 0;
const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { render(); saveSettings(); }); };

function updateUI() {
  const b = +$('blur').value, t = +$('tones').value;
  $('bv').textContent = b === 0 ? 'Off' : b;
  $('tv').textContent = t;
  $('tLab').innerHTML = gray ? 'Tones' : 'Levels <small>per colour channel</small>';
  $('readout').textContent = !base ? 'Blur + Tones' : showOrig ? 'Original'
    : `Blur ${b === 0 ? 'off' : b} · ${t} ${gray ? 'tones' : 'levels'}`;
  document.querySelectorAll('.step').forEach(s => {
    const el = $(s.dataset.t), v = +el.value;
    s.disabled = +s.dataset.d < 0 ? v <= +el.min : v >= +el.max;
  });
  document.querySelectorAll('.chips').forEach(c => {
    const v = $(c.dataset.for).value;
    c.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('on', ch.dataset.v === v));
  });
  $('mGray').classList.toggle('on', gray); $('mCol').classList.toggle('on', !gray);
  $('mGray').setAttribute('aria-pressed', gray); $('mCol').setAttribute('aria-pressed', !gray);
  const sw = $('sw');
  if (gray) {
    sw.hidden = false;
    if (sw.childElementCount !== t) {
      sw.innerHTML = '';
      for (let i = 0; i < t; i++) { const d = document.createElement('div'), v = Math.round(i/(t-1)*255); d.style.background = `rgb(${v},${v},${v})`; sw.appendChild(d); }
    }
  } else sw.hidden = true;
}

/* ---------- settings sheet ---------- */
const sheet = $('sheet'), fab = $('fab');
function openSheet() { sheet.classList.add('open'); fab.parentElement.hidden = true; fab.setAttribute('aria-expanded', 'true'); }
function closeSheet() { if (!sheet.classList.contains('open')) return; sheet.classList.remove('open'); fab.parentElement.hidden = false; fab.setAttribute('aria-expanded', 'false'); }
fab.onclick = openSheet;
$('closeSheet').onclick = e => { e.stopPropagation(); closeSheet(); };
// swipe the sheet header down to close
(() => { let y0 = null;
  $('grab').addEventListener('pointerdown', e => { y0 = e.clientY; });
  $('grab').addEventListener('pointerup', e => { if (y0 !== null && e.clientY - y0 > 30) closeSheet(); y0 = null; });
})();
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); $('ov').hidden = true; } });

/* ---------- controls ---------- */
['blur', 'tones'].forEach(id => $(id).addEventListener('input', schedule));
function bump(id, d) {
  const el = $(id), v = Math.min(+el.max, Math.max(+el.min, +el.value + d));
  if (v === +el.value) return false;
  el.value = v; schedule(); return true;
}
document.querySelectorAll('.step').forEach(btn => {
  let t1, t2;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); stop();
    bump(btn.dataset.t, +btn.dataset.d);
    t1 = setTimeout(() => { t2 = setInterval(() => { if (!bump(btn.dataset.t, +btn.dataset.d)) stop(); }, 70); }, 420);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('click', e => { if (e.detail === 0) bump(btn.dataset.t, +btn.dataset.d); }); // keyboard
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
document.querySelectorAll('.chips').forEach(c => c.addEventListener('click', e => {
  const ch = e.target.closest('.chip'); if (!ch) return;
  $(c.dataset.for).value = ch.dataset.v; schedule();
}));
$('mGray').onclick = () => { gray = true; schedule(); };
$('mCol').onclick = () => { gray = false; schedule(); };
$('reset').onclick = () => { $('blur').value = DEF.blur; $('tones').value = DEF.tones; gray = DEF.gray; schedule(); };

// compare: hold the floating button
(() => { const el = $('cmp');
  el.addEventListener('pointerdown', e => { if (!base) return; e.preventDefault(); showOrig = true; el.classList.add('on'); render(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => { if (showOrig) { showOrig = false; el.classList.remove('on'); render(); } }));
  el.addEventListener('contextmenu', e => e.preventDefault());
})();

// save: show a real <img> so long-press "Download image" works
$('save').onclick = () => { if (!base) return; $('ovImg').src = cv.toDataURL('image/png'); $('ov').hidden = false; };
$('ovClose').onclick = () => { $('ov').hidden = true; };
$('ov').addEventListener('click', e => { if (e.target === $('ov')) $('ov').hidden = true; });

/* ---------- pan & zoom ---------- */
const view = { x: 0, y: 0, s: 1 }; let fitS = 1;
const ptrs = new Map(); let moved = 0, multi = false, lastTap = 0, lastPos = null;
const vp = () => ({ w: stage.clientWidth, h: stage.clientHeight });
function apply() {
  cv.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  $('fitBtn').hidden = !base || Math.abs(view.s / fitS - 1) < 0.02;
}
function clampView() {
  const { w, h } = vp(), iw = W * view.s, ih = H * view.s;
  view.x = iw <= w ? (w - iw) / 2 : Math.min(0, Math.max(w - iw, view.x));
  view.y = ih <= h ? (h - ih) / 2 : Math.min(0, Math.max(h - ih, view.y));
}
function fit() {
  if (!base) return;
  const { w, h } = vp(), m = 12;
  fitS = Math.min((w - m*2) / W, (h - m*2) / H);
  view.s = fitS; clampView(); apply();
}
function zoomAt(cx, cy, s) {
  s = Math.min(fitS * 12, Math.max(fitS, s));
  view.x = cx - (cx - view.x) * (s / view.s);
  view.y = cy - (cy - view.y) * (s / view.s);
  view.s = s; clampView(); apply();
}
function animateTo(fn) { cv.style.transition = 'transform .22s ease'; fn(); setTimeout(() => cv.style.transition = '', 240); }
const two = () => { const [a, b] = [...ptrs.values()]; return { c: { x: (a.x+b.x)/2, y: (a.y+b.y)/2 }, d: Math.hypot(a.x-b.x, a.y-b.y) || 1 }; };

stage.addEventListener('pointerdown', e => {
  if (!base) return;                          // let the empty-state picker work
  e.preventDefault();
  closeSheet();                               // touching the image collapses the settings
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { moved = 0; multi = false; } else multi = true;
});
stage.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 1) {
    view.x += e.clientX - p.x; view.y += e.clientY - p.y;
    moved += Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y);
    p.x = e.clientX; p.y = e.clientY;
    clampView(); apply();
  } else {
    const before = two();
    p.x = e.clientX; p.y = e.clientY;
    const after = two();
    view.x += after.c.x - before.c.x; view.y += after.c.y - before.c.y;
    zoomAt(after.c.x, after.c.y, view.s * after.d / before.d);
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size || multi || moved > 10 || e.type === 'pointercancel') return;
  const now = performance.now();
  if (now - lastTap < 300 && lastPos && Math.hypot(e.clientX - lastPos.x, e.clientY - lastPos.y) < 40) {
    animateTo(() => view.s > fitS * 1.05 ? fit() : zoomAt(e.clientX, e.clientY, fitS * 2.5));
    lastTap = 0;
  } else { lastTap = now; lastPos = { x: e.clientX, y: e.clientY }; }
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', e => { if (!base) return; e.preventDefault(); closeSheet(); zoomAt(e.clientX, e.clientY, view.s * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
stage.addEventListener('contextmenu', e => e.preventDefault());
$('fitBtn').onclick = () => animateTo(fit);
addEventListener('resize', () => { if (base) fit(); });

function showHint() {
  let seen = false; try { seen = localStorage.getItem('blurTonesHint'); } catch (e) {}
  if (seen) return;
  const g = $('gest'); g.hidden = false; g.style.opacity = 1;
  setTimeout(() => { g.style.opacity = 0; setTimeout(() => g.hidden = true, 450); }, 3500);
  try { localStorage.setItem('blurTonesHint', '1'); } catch (e) {}
}

updateUI();

/* ---------- installable app: offline + "Share to Tones" ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (location.search.includes('shared=1') && 'caches' in window) {
  caches.open('shared').then(c => c.match('./shared-image').then(r => r && r.blob().then(b => { load(b); c.delete('./shared-image'); history.replaceState(null, '', './'); })));
}
</script>
